<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Hadita</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #bubble { max-width: 210px; margin-bottom: 6px; padding: 6px 10px; border-radius: 10px;
    background: #1d1b2e; color: #f3f0ff; font-size: 12px; line-height: 1.3; text-align: center;
    border: 2px solid #8f7cf0; opacity: 0; transition: opacity .2s; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #bubble.show { opacity: 1; }
  #sprite { width: 96px; height: 96px; image-rendering: pixelated; cursor: pointer; }
  #close { position: absolute; top: 2px; right: 4px; border: 0; background: #1d1b2e; color: #f3f0ff;
    width: 18px; height: 18px; border-radius: 9px; font-size: 11px; line-height: 18px; padding: 0;
    opacity: .35; cursor: pointer; }
  #close:hover, #mute:hover { opacity: 1; }
  #mute { position: absolute; top: 2px; right: 26px; border: 0; background: #1d1b2e; color: #f3f0ff;
    min-width: 18px; height: 18px; border-radius: 9px; font-size: 10px; line-height: 18px; padding: 0 4px;
    opacity: .35; cursor: pointer; }
  #sprite.hop { animation: hop .5s ease-out 2; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
</style>
</head>
<body>
  <button id="mute"></button>
  <button id="close" title="Cerrar">×</button>
  <div id="wrap">
    <div id="bubble"></div>
    <canvas id="sprite" width="16" height="18"></canvas>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
