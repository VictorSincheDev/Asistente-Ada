<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:">
<title>Hadita</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #bubble { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1;
    width: max-content; max-width: 260px; padding: 6px 10px; border-radius: 10px;
    background: #1d1b2e; color: #f3f0ff; font-size: 12px; line-height: 1.3; text-align: center;
    border: 2px solid #8f7cf0; opacity: 0; transition: opacity .2s; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #bubble.show { opacity: 1; }
  #avatar { position: absolute; left: 0; bottom: 0; width: 300px; height: 370px; cursor: pointer; }
  #close { position: absolute; top: 2px; right: 4px; border: 0; background: #1d1b2e; color: #f3f0ff;
    width: 18px; height: 18px; border-radius: 9px; font-size: 11px; line-height: 18px; padding: 0;
    opacity: .35; cursor: pointer; z-index: 2; }
  #close:hover, #mute:hover { opacity: 1; }
  #mute { position: absolute; top: 2px; right: 26px; border: 0; background: #1d1b2e; color: #f3f0ff;
    min-width: 18px; height: 18px; border-radius: 9px; font-size: 10px; line-height: 18px; padding: 0 4px;
    opacity: .35; cursor: pointer; z-index: 2; }
</style>
</head>
<body>
  <button id="mute"></button>
  <button id="close" title="Cerrar">×</button>
  <div id="bubble"></div>
  <canvas id="avatar"></canvas>
  <script src="dist/renderer.js"></script>
</body>
</html>
